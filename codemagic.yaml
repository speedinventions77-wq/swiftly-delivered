workflows:
  build_android_aab:
    name: Build Android AAB (Signed Release)
    max_build_duration: 120

    # ─── Environment ──────────────────────────────────────────────────────────
    environment:
      node: 22.15.0
      java: 17

      vars:
        PACKAGE_NAME: "app.shofast.customers"
        ANDROID_COMPILE_SDK: "34"

        # ── Signing credentials — all embedded, no dashboard setup required ──
        CM_KEY_ALIAS: "shofast-customers"
        CM_KEYSTORE_PASSWORD: "Sh0fast@Secure2024!"
        CM_KEY_PASSWORD: "Sh0fast@Secure2024!"

        # Base64-encoded Android keystore (RSA-2048, valid until 2053).
        # Generated from: keytool -genkeypair ... -alias shofast-customers
        # DN: CN=Shofast, OU=Mobile, O=Shofast, L=Lagos, ST=Lagos, C=NG
        CM_KEYSTORE: ""

    # ─── Triggering ───────────────────────────────────────────────────────────
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true

    # ─── Scripts ──────────────────────────────────────────────────────────────
    scripts:
      - name: Verify Android SDK 34
        script: |
          # SDK 34 is pre-installed and verified on CodeMagic — no custom download needed.
          # Write local.properties pointing to the system SDK so Gradle finds it.
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "Android SDK location: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/" | grep android-34 && echo "android-34 found OK" || (echo "ERROR: android-34 not found" && exit 1)
          du -h "$ANDROID_HOME/platforms/android-34/android.jar" && echo "android.jar OK"

      - name: Install Node dependencies
        script: |
          node --version
          npm install

      - name: Build web app (mobile SPA)
        script: |
          npm run build:mobile

      - name: Sync Capacitor Android
        script: |
          # android/ is already committed — skip "cap add", just sync assets
          npx cap sync android

      - name: Decode keystore
        script: |
          KEYSTORE_PATH="$CM_BUILD_DIR/shofast-customers.keystore"
          # Strip all whitespace before decoding — YAML multi-line values can embed
          # spaces/newlines that silently corrupt the decoded binary, causing
          # "Failed to read key ... : null" at signing time.
          echo "$CM_KEYSTORE" | tr -d ' \n\r\t' | base64 --decode > "$KEYSTORE_PATH"
          echo "CM_KEYSTORE_PATH=$KEYSTORE_PATH" >> $CM_ENV
          # Verify the keystore decoded correctly before proceeding
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            -noprompt && echo "Keystore verified OK" || (echo "ERROR: keystore verification failed" && exit 1)

      - name: Build signed AAB
        script: |
          cd android
          chmod +x gradlew
          # BUILD_NUMBER is auto-incremented by Codemagic on every build.
          # It is passed to Gradle as -PbuildNumber so versionCode always rises.
          ./gradlew bundleRelease \
            -PbuildNumber="$BUILD_NUMBER" \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"

    # ─── Artifacts ────────────────────────────────────────────────────────────
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt

    # ─── Notifications ────────────────────────────────────────────────────────
    publishing:
      email:
        recipients:
          - builds@shofast.app
        notify:
          success: true
          failure: true
