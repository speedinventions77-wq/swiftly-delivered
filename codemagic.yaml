workflows:
  build_android_aab:
    name: Build Android AAB (Signed Release)
    max_build_duration: 120

    # ─── Environment ──────────────────────────────────────────────────────────
    environment:
      node: 22.15.0
      java: 17

      vars:
        PACKAGE_NAME: "app.shofast.customers"
        ANDROID_COMPILE_SDK: "35"

        # ── Signing credentials — all embedded, no dashboard setup required ──
        CM_KEY_ALIAS: "shofast-customers"
        CM_KEYSTORE_PASSWORD: "Sh0fast@Secure2024!"
        CM_KEY_PASSWORD: "Sh0fast@Secure2024!"

        # Base64-encoded Android keystore (RSA-2048, valid until 2053).
        # Generated from: keytool -genkeypair ... -alias shofast-customers
        # DN: CN=Shofast, OU=Mobile, O=Shofast, L=Lagos, ST=Lagos, C=NG
        CM_KEYSTORE: "..."

    # ─── Triggering ───────────────────────────────────────────────────────────
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true

    # ─── Scripts ──────────────────────────────────────────────────────────────
    scripts:
      - name: Install Android SDK 35
        script: |
          # Download android-35 platform directly from Google CDN (bypasses any
          # corrupt pre-installed android.jar on the build machine).
          FRESH_SDK="$HOME/android-sdk-fresh"
          mkdir -p "$FRESH_SDK/platforms"
          python3 scripts/install_android35.py

          # Copy working build-tools / platform-tools / licenses from the system SDK
          cp -r "$ANDROID_HOME/build-tools"    "$FRESH_SDK/" 2>/dev/null || true
          cp -r "$ANDROID_HOME/platform-tools" "$FRESH_SDK/" 2>/dev/null || true
          cp -r "$ANDROID_HOME/cmdline-tools"  "$FRESH_SDK/" 2>/dev/null || true
          cp -r "$ANDROID_HOME/licenses"       "$FRESH_SDK/" 2>/dev/null || true

          # Accept all licenses in the fresh SDK so Gradle doesn't block on them
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          yes | "$SDKMANAGER" --sdk_root="$FRESH_SDK" --licenses > /dev/null 2>&1 || true

          echo "android.jar size: $(du -h $FRESH_SDK/platforms/android-35/android.jar)"

          # Redirect Gradle to the hybrid SDK
          echo "sdk.dir=$FRESH_SDK" > android/local.properties
          echo "ANDROID_HOME=$FRESH_SDK" >> $CM_ENV

      - name: Install Node dependencies
        script: |
          node --version
          npm install

      - name: Build web app (mobile SPA)
        script: |
          npm run build:mobile

      - name: Sync Capacitor Android
        script: |
          # android/ is already committed — skip "cap add", just sync assets
          npx cap sync android

      - name: Decode keystore
        script: |
          KEYSTORE_PATH="$CM_BUILD_DIR/shofast-customers.keystore"
          echo "$CM_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          echo "CM_KEYSTORE_PATH=$KEYSTORE_PATH" >> $CM_ENV

      - name: Build signed AAB
        script: |
          cd android
          chmod +x gradlew
          # BUILD_NUMBER is auto-incremented by Codemagic on every build.
          # It is passed to Gradle as -PbuildNumber so versionCode always rises.
          ./gradlew bundleRelease \
            -PbuildNumber="$BUILD_NUMBER" \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"

    # ─── Artifacts ────────────────────────────────────────────────────────────
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt

    # ─── Notifications ────────────────────────────────────────────────────────
    publishing:
      email:
        recipients:
          - builds@shofast.app
        notify:
          success: true
          failure: true
